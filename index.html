<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="子どもへの関わり方を振り返り、気づきを得るための簡易チェックです。12問・約2分で完了します。">
  <title>親のNG行動チェック</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== Top Screen ========== -->
  <div id="screen-top" class="screen active">
    <div class="container">
      <header class="top-header">
        <span class="logo-icon">🔍</span>
        <h1 class="service-title">親のNG行動チェック</h1>
        <p class="service-tagline">関わり方を振り返るためのツール</p>
      </header>

      <main class="top-main">
        <div class="intro-card">
          <p class="intro-text">
            このチェックは親を責めるためではなく、<br>
            <strong>関わり方に気づくため</strong>のツールです。
          </p>
          <div class="time-badge">⏱ 12問・約2分で完了</div>
        </div>

        <div class="features">
          <div class="feature-item">
            <span class="feature-icon">📋</span>
            <span>全12問の選択式質問</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">📊</span>
            <span>5つのカテゴリで傾向を分析</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">💬</span>
            <span>関わり方を改善するヒントを提案</span>
          </div>
        </div>

        <button id="btn-start" class="btn-primary">診断を始める</button>

        <p class="disclaimer">
          ※このチェックは医療的な診断ではありません。<br>
          気づきの参考としてご活用ください。<br>
          入力内容は外部に送信されません。
        </p>
      </main>
    </div>
  </div>

  <!-- ========== Quiz Screen ========== -->
  <div id="screen-quiz" class="screen">
    <div class="container">
      <div class="question-header">
        <div class="question-counter">
          <span id="progress-label">1 / 12</span>
        </div>
        <div class="progress-bar-container">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div id="question-card" class="question-card">
        <span id="q-number" class="q-number">Q1</span>
        <p id="q-text" class="q-text"></p>
        <div id="choices-list" class="choices-list"></div>
      </div>

      <button id="btn-back" class="btn btn-back">← 前の問題に戻る</button>
    </div>
  </div>

  <!-- ========== Result Screen ========== -->
  <div id="screen-result" class="screen">
    <div class="container">
      <h2 class="result-heading">診断結果</h2>

      <div class="card score-card">
        <p class="score-label">総合スコア</p>
        <div class="score-display">
          <span id="total-score" class="score-number">0</span>
          <span id="score-denom" class="score-denom">/ 48点</span>
        </div>
        <span id="result-badge" class="result-badge"></span>
        <p id="result-praise" class="result-praise"></p>
        <p id="result-comment" class="result-comment"></p>
      </div>

      <div class="card">
        <h3 class="card-heading">カテゴリ別スコア</h3>
        <div id="category-list" class="category-list"></div>
      </div>

      <div class="card">
        <h3 class="card-heading">カテゴリ別アドバイス</h3>
        <div id="advice-list" class="advice-list"></div>
      </div>

      <!-- 育成ガイド (JS で生成) -->
      <div id="guide-section"></div>

      <p class="result-disclaimer">
        このチェックは医療的な診断ではありません。<br>
        あくまで気づきの参考としてご利用ください。
      </p>

      <button id="btn-guide" class="btn btn-guide">📖 育成ガイドを購入する（¥980）</button>
      <button id="btn-retry" class="btn btn-secondary">もう一度チェックする</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
